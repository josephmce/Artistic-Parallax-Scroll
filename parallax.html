<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="parallax">

  <!-- Moving Layers -->
  <div class="parallax-inner">
    <img src="bg-1.png" class="layer" data-speed="0" />
    <img src="2.png" class="layer" data-speed="0.9" />
    <img src="3.png" class="layer" data-speed="1" />
    <img src="4.png" class="layer" data-speed="1.1" />
    <img src="5.png" class="layer" data-speed="1.2" />
    <img src="6.png" class="layer" data-speed="1.3" />
    <img src="7.png" class="layer" data-speed="1.4" />
    <div class="layer"  data-speed="1.4" style="
    height: 1000px;
    background: blue;

">
        <p>Test</p>
    </div>
  </div>

</section>



<script src="script.js"></script>
</body>
</html>
